services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iswara_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-iswara}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      - db
    networks:
      - iswara_network

  db:
    image: postgres:15
    container_name: iswara_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-iswara}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - iswara_db_data:/var/lib/postgresql/data
    networks:
      - iswara_network

networks:
  iswara_network:
    driver: bridge

volumes:
  iswara_db_data:
